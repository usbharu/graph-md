name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use the format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  vsix:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build Markdown preview plugin
        run: pnpm --filter markdown-it-graphmd build
      - name: Apply tag version to extension
        working-directory: lsp/vscode
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Package VSIX
        working-directory: lsp/vscode
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm dlx @vscode/vsce@3.9.2 package --out "graph-md-vscode-$VERSION.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: lsp/vscode/*.vsix
          if-no-files-found: error

  cli-common:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build JVM and Node.js releases
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./gradlew "-PreleaseVersion=$VERSION" :cli:jvmReleaseJar :cli:jsReleaseArchive
      - uses: actions/upload-artifact@v7
        with:
          name: cli-common
          path: cli/build/distributions/*
          if-no-files-found: error

  cli-native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            task: macosArm64ReleaseArchive
            artifact: cli-macos-arm64
          - os: macos-15-intel
            task: macosX64ReleaseArchive
            artifact: cli-macos-x64
          - os: ubuntu-latest
            task: linuxX64ReleaseArchive
            artifact: cli-linux-x64
          - os: windows-latest
            task: mingwX64ReleaseArchive
            artifact: cli-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build native release
        run: ./gradlew "-PreleaseVersion=${{ needs.prepare.outputs.version }}" :cli:${{ matrix.task }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cli/build/distributions/*
          if-no-files-found: error

  release:
    needs: [prepare, vsix, cli-common, cli-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate and verify release checksums
        run: |
          sh scripts/generate-release-checksums.sh release-assets release-assets/SHA256SUMS
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          generated_notes="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              --jq ".body"
          )"

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "GraphMD $TAG_NAME includes the VS Code extension and multiplatform CLI."
            echo
            echo "## 📦 Assets"
            echo
            echo "- graph-md-vscode-$VERSION.vsix"
            echo "- graphmd-jvm-$VERSION.jar"
            echo "- graphmd-node-$VERSION.zip"
            echo "- Native archives for macOS arm64/x64, Linux x64, and Windows x64"
            echo "- SHA256SUMS"
            echo
            printf '%s\n' "$generated_notes"
          } > "$notes_file"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
            gh release edit "$TAG_NAME" \
              --title "GraphMD $TAG_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$TAG_NAME" release-assets/* \
              --verify-tag \
              --title "GraphMD $TAG_NAME" \
              --notes-file "$notes_file"
          fi
