name: CLI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test JVM and JavaScript
        run: ./gradlew :core:jvmTest :cli:jvmTest :cli:jsNodeTest :cli:jsProductionExecutableCompileSync

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            task: linkReleaseExecutableMacosArm64
            test: macosArm64Test
          - os: macos-15-intel
            task: linkReleaseExecutableMacosX64
            test: macosX64Test
          - os: ubuntu-latest
            task: linkReleaseExecutableLinuxX64
            test: linuxX64Test
          - os: windows-latest
            task: linkReleaseExecutableMingwX64
            test: mingwX64Test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build native executable
        run: ./gradlew :cli:${{ matrix.test }} :cli:${{ matrix.task }}
