name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Core
            tasks: ":core:jvmTest :core:jsTest"
          - name: Query
            tasks: ":query:jvmTest :query:jsTest"
          - name: CLI
            tasks: ":cli:jvmTest :cli:compileKotlinJs"
          - name: LSP
            tasks: ":lsp:test"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test ${{ matrix.name }}
        run: ./gradlew ${{ matrix.tasks }}

  node:
    name: Node.js checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Markdown preview plugin
        run: pnpm --filter markdown-it-graphmd build
      - name: Compile VS Code extension
        run: pnpm --filter graph-md-vscode compile
      - parallel:
          - name: Type-check Markdown plugin
            run: pnpm --filter markdown-it-graphmd exec tsc --noEmit
          - name: Test Markdown plugin
            run: pnpm --filter markdown-it-graphmd exec vitest run
          - name: Type-check VS Code extension
            run: pnpm --filter graph-md-vscode exec tsc -p ./tsconfig.json --noEmit
          - name: Test VS Code extension
            run: pnpm --filter graph-md-vscode exec node --test
