name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Core
            tasks: ":core:jvmTest :core:jsTest"
          - name: Query
            tasks: ":query:jvmTest :query:jsTest"
          - name: CLI
            tasks: ":cli:jvmTest :cli:compileKotlinJs"
          - name: LSP
            tasks: ":lsp:test"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test ${{ matrix.name }}
        run: ./gradlew ${{ matrix.tasks }}

  node:
    name: Node.js checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro integration
        run: ./gradlew :astro:jsNodeProductionLibraryDistribution
      - name: Install site template dependencies
        run: pnpm --dir site-template install --frozen-lockfile
      - name: Generate site project with CLI
        run: |
          ./gradlew :cli:run \
            --args="site ${RUNNER_TEMP}/graphmd-generated-site ${GITHUB_WORKSPACE}/site-template/tests/fixtures/prototype-keys --base /wiki/ --json"
      - name: Install generated site dependencies
        run: pnpm --dir "${RUNNER_TEMP}/graphmd-generated-site" install --frozen-lockfile
      - name: Check and build generated site
        run: |
          pnpm --dir "${RUNNER_TEMP}/graphmd-generated-site" check
          pnpm --dir "${RUNNER_TEMP}/graphmd-generated-site" build
          test -f "${RUNNER_TEMP}/graphmd-generated-site/dist/index.html"
          test -f "${RUNNER_TEMP}/graphmd-generated-site/dist/documents/prototype-item/index.html"
          test -f "${RUNNER_TEMP}/graphmd-generated-site/dist/search/index.html"
          test -f "${RUNNER_TEMP}/graphmd-generated-site/dist/graph/index.html"
          test -f "${RUNNER_TEMP}/graphmd-generated-site/dist/search-index/manifest.json"
          test -f "${RUNNER_TEMP}/graphmd-generated-site/dist/runtime/graph-md-query-runtime.js"
          grep -Fq 'href="/wiki/' "${RUNNER_TEMP}/graphmd-generated-site/dist/index.html"
      - name: Test runtime build scripts
        run: node --test scripts/*.test.mjs
      - name: Verify embedded browser runtimes
        run: |
          ./gradlew :cli:bundleQueryWebRuntime :cli:bundleMarkdownItGraphMd
          node scripts/verify-embedded-web-runtime.mjs \
            site-template/runtime-encoded/graph-md-query-runtime.js.gz.b64 cli/build/webRuntime/graph-md-query-runtime.js \
            site-template/runtime-encoded/markdown-it-graphmd.js.gz.b64 markdown-it-graphmd/dist/index.js
      - name: Build Markdown preview plugin
        run: pnpm --filter markdown-it-graphmd build
      - name: Compile VS Code extension
        run: pnpm --filter graph-md-vscode compile
      - parallel:
          - name: Type-check Markdown plugin
            run: pnpm --filter markdown-it-graphmd exec tsc --noEmit
          - name: Test Markdown plugin
            run: pnpm --filter markdown-it-graphmd exec vitest run
          - name: Type-check VS Code extension
            run: pnpm --filter graph-md-vscode exec tsc -p ./tsconfig.json --noEmit
          - name: Test VS Code extension
            run: pnpm --filter graph-md-vscode exec node --test
          - name: Check site template
            run: pnpm --dir site-template check
          - name: Test site template edge cases
            run: pnpm --dir site-template test:prototype-keys
