name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run Gradle checks
        run: >-
          ./gradlew
          :core:jvmTest :core:jsTest
          :query:jvmTest :query:jsTest
          :cli:jvmTest :cli:compileKotlinJs
          :lsp:test

  node:
    name: Node.js checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Markdown preview plugin
        run: pnpm --filter markdown-it-graphmd build
      - name: Type-check packages
        run: pnpm --recursive typecheck
      - name: Test packages
        run: pnpm --recursive test
