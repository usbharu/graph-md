name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use the format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=graph-md-vscode-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Build Markdown preview plugin
        run: pnpm --filter markdown-it-graphmd build

      - name: Apply tag version to extension
        working-directory: lsp/vscode
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: pnpm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        working-directory: lsp/vscode
        env:
          VSIX_NAME: ${{ steps.version.outputs.vsix }}
        run: pnpm dlx @vscode/vsce@3.9.2 package --out "$VSIX_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VSIX_NAME: ${{ steps.version.outputs.vsix }}
          VSIX_PATH: lsp/vscode/${{ steps.version.outputs.vsix }}
        run: |
          generated_notes="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              --jq ".body"
          )"

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "GraphMD language support for Visual Studio Code."
            echo
            echo "## 📦 Install"
            echo
            echo "Download [$VSIX_NAME](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$VSIX_NAME), then run:"
            echo
            echo '```sh'
            echo "code --install-extension $VSIX_NAME"
            echo '```'
            echo
            printf '%s\n' "$generated_notes"
          } > "$notes_file"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$VSIX_PATH" --clobber
            gh release edit "$TAG_NAME" \
              --title "GraphMD VS Code $TAG_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$TAG_NAME" "$VSIX_PATH" \
              --verify-tag \
              --title "GraphMD VS Code $TAG_NAME" \
              --notes-file "$notes_file"
          fi
