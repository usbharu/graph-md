# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# `check` compiles and links every Kotlin/Native target. Gradle's default
# daemon limits are too small for several native compiler workers and can
# terminate with Java heap space / Metaspace errors.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=4

# The repository itself is a pnpm workspace. Kotlin's bundled Yarn 1 treats
# the root packageManager field as a Yarn version, producing "yarn@pnpm@...".
# Use Kotlin/JS's supported npm backend so the two package managers stay isolated.
kotlin.js.yarn=false
